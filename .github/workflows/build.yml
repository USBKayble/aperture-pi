name: Build Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            debootstrap parted dosfstools e2fsprogs \
            rsync xz-utils coreutils quilt \
            ca-certificates curl unzip

      - name: Install sdm
        run: |
          curl -sSL "https://raw.githubusercontent.com/gitbls/sdm/master/install-install-script.sh" | sudo bash

      - name: Create working directories
        run: mkdir -p work deploy

      - name: Download RPi OS Lite base image
        run: |
          curl -L -o work/base-image.img.xz \
            "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-20240315/2024-03-15-raspios-bookworm-arm64-lite.img.xz"
        timeout-minutes: 10

      - name: Decompress base image
        if: always()
        run: |
          if [ -f work/base-image.img.xz ]; then
            unxz work/base-image.img.xz
          fi

      - name: Build Aperture image with sdm
        run: |
          sudo sdm \
            --image work/base-image.img \
            --expand \
            --copy "sdm-hooks/etc:/etc" \
            --copy "aperture:/opt/aperture" \
            --install "tshark,rtl-sdr,gpsd,gpsd-clients,hostapd,dnsmasq,python3-pip,python3-venv" \
            --hostname "aperture" \
            --username "aperture" \
            --password "raspberry" \
            --ssh-password-access \
            --enable "aperture-monitor,aperture-web,gpsd,hostapd,dnsmasq" \
            --name aperture-pi \
            --compress
        timeout-minutes: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aperture-pi-image
          path: work/*.img*

      - name: Create Release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Aperture Pi Image v${{ github.run_number }}"
          body: |
            Auto-built Raspberry Pi image from commit ${{ github.sha }}

            Includes:
            - WiFi probe request sniffer (tshark + OUI + IE fingerprint)
            - RTL-SDR energy detection on LTE uplink bands
            - GPS6MV2/NEO-6M support via gpsd
            - Flask web dashboard with Leaflet map
            - SQLite database with KML/CSV/GPX export

            Flash with:
            ```bash
            gunzip -c aperture-pi.img.gz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            ```
          files: work/*.img*
          generate_release_notes: true
